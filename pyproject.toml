[project]
name = "bamatlas"
version = "0.1.0"
description = "Expertise directory for BAM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "argon2-cffi>=25,<26",
  "dj-database-url>=3,<4",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6.1,<7",
  "pytest-django>=4.8,<5",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = ["*/migrations/*.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
]
